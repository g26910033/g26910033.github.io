<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前往日本打工度假申請頁</title></head><body>
<p>正在前往新版日本打工度假申請頁…</p>
<script>
(()=>{
  const state={};
  try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith('jpwh2026_'))state[key]=localStorage.getItem(key);}}catch{}
  const hash=Object.keys(state).length?'#jp-state='+encodeURIComponent(JSON.stringify(state)):'';
  location.replace('https://lute.tw/jp/'+hash);
})();
</script>
<noscript><a href="https://lute.tw/jp/">開啟新版日本打工度假申請頁</a></noscript>
</body></html>
